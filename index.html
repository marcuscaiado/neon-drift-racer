<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Drift Racer 🏎️💨</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { background:#070714; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    #canvas-container { position:relative; width:100vw; height:100vh; max-width:800px; max-height:600px; aspect-ratio:4/3; }
    canvas { width:100%; height:100%; display:block; background:#070714; }
    .arcade-nav { position:absolute; top:16px; right:16px; z-index:100; background:rgba(0,0,0,0.7); border:2px solid #ff007f; color:#ff007f; padding:8px 16px; border-radius:8px; font-weight:bold; text-decoration:none; font-size:13px; box-shadow:0 0 15px rgba(255,0,127,0.4); }
    .hud { position:absolute; top:16px; left:16px; font-family:monospace; font-size:18px; font-weight:bold; color:#00f5ff; text-shadow:0 0 10px #00f5ff; pointer-events:none; }
    .nitro-btn { position:absolute; bottom:24px; right:24px; width:75px; height:75px; border-radius:50%; background:radial-gradient(circle,#ff007f,#000); border:3px solid #ff007f; color:#fff; font-size:22px; font-weight:900; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 0 25px rgba(255,0,127,0.6); pointer-events:auto; cursor:pointer; }
    .nitro-btn:active { transform:scale(0.92); }
    .steer-hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:14px; color:#aaa; pointer-events:none; }
    #gameover-modal { position:absolute; inset:0; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:200; }
    #gameover-modal h1 { color:#ff007f; font-size:42px; text-shadow:0 0 20px #ff007f; }
    .btn { background:linear-gradient(135deg,#00f5ff,#ff007f); border:none; color:#fff; padding:12px 32px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; text-decoration:none; box-shadow:0 0 20px rgba(0,245,255,0.5); }
  </style>
</head>
<body>
  <div id="canvas-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav">🕹️ Arcade Hub</a>
    <div class="hud">
      <div>SPEED: <span id="speed-val">180</span> KM/H</div>
      <div>SCORE: <span id="score-val">0</span></div>
      <div>NITRO: <span id="nitro-val">100%</span></div>
    </div>
    <div class="steer-hint">Move Mouse / Drag Touch to Steer 🏎️ • Hold Click / Space for NITRO ⚡</div>
    <div class="nitro-btn" id="btn-nitro">
      <span>⚡</span>
      <span style="font-size:10px;">NITRO</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="gameover-modal">
      <h1>CRASHED! 💥</h1>
      <p style="font-size:20px;">SCORE: <span id="final-score">0</span></p>
      <button class="btn" onclick="restartGame()">RACE AGAIN 🔄</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#222; border:1px solid #ff007f;">ARCADE HUB 🕹️</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Synth
    let audioCtx = null;
    function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
    function playBeep(freq, dur) {
      try {
        const c = getAudio(); const osc = c.createOscillator(); const g = c.createGain();
        osc.frequency.value = freq; g.gain.setValueAtTime(0.1, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + dur);
        osc.connect(g); g.connect(c.destination); osc.start(); osc.stop(c.currentTime + dur);
      } catch(e){}
    }

    // State
    let speed = 180, baseSpeed = 180, maxSpeed = 280, nitro = 100, score = 0, playerX = 0, targetPlayerX = 0, roadOffset = 0, isGameOver = false;
    let isBoosting = false;
    let traffic = [], particles = [];

    // Steering Controls (Mouse, Touch, Keyboard)
    const setSteerPos = (cx) => {
      const rect = canvas.getBoundingClientRect();
      const norm = ((cx - rect.left) / rect.width) * 2 - 1; // -1 to 1
      targetPlayerX = Math.max(-0.85, Math.min(0.85, norm * 1.3));
    };

    window.addEventListener('mousemove', e => setSteerPos(e.clientX));
    window.addEventListener('touchmove', e => { e.preventDefault(); setSteerPos(e.touches[0].clientX); }, { passive:false });
    window.addEventListener('touchstart', e => { e.preventDefault(); setSteerPos(e.touches[0].clientX); }, { passive:false });

    window.addEventListener('mousedown', e => { if (!e.target.closest('.arcade-nav, #gameover-modal')) isBoosting = true; });
    window.addEventListener('mouseup', () => isBoosting = false);
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') targetPlayerX = Math.max(-0.85, targetPlayerX - 0.25);
      if (e.key === 'ArrowRight' || e.key === 'd') targetPlayerX = Math.min(0.85, targetPlayerX + 0.25);
      if (e.key === ' ' || e.key === 'Shift') isBoosting = true;
    });
    window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Shift') isBoosting = false; });

    const nitroBtn = document.getElementById('btn-nitro');
    nitroBtn.addEventListener('touchstart', e => { e.preventDefault(); isBoosting = true; });
    nitroBtn.addEventListener('touchend', e => { e.preventDefault(); isBoosting = false; });

    function spawnTraffic() {
      if (traffic.length < 5 && Math.random() < 0.04) {
        traffic.push({
          x: (Math.random() - 0.5) * 1.5,
          z: 1.0,
          speed: 90 + Math.random() * 50,
          color: ['#ff007f', '#00f5ff', '#ffff00', '#00ff88', '#b967ff'][Math.floor(Math.random() * 5)]
        });
      }
    }

    function restartGame() {
      speed = 180; nitro = 100; score = 0; playerX = 0; targetPlayerX = 0; roadOffset = 0; traffic = []; particles = []; isGameOver = false;
      document.getElementById('gameover-modal').style.display = 'none';
      requestAnimationFrame(loop);
    }

    function loop() {
      if (isGameOver) return;

      // Smooth Steering Lerp
      playerX += (targetPlayerX - playerX) * 0.15;

      // Nitro & Speed
      if (isBoosting && nitro > 0) {
        speed = Math.min(speed + 3, maxSpeed);
        nitro -= 0.5;
        // Nitro flame particles
        for (let i=0; i<3; i++) {
          particles.push({ x: 400 + (Math.random()-0.5)*20, y: 550, vx:(Math.random()-0.5)*4, vy: 5 + Math.random()*4, color: '#00f5ff', life: 1 });
        }
      } else {
        speed = Math.max(speed - 1.5, baseSpeed);
        if (nitro < 100) nitro += 0.15;
      }

      score += Math.floor(speed * 0.06);
      roadOffset += speed * 0.003;
      spawnTraffic();

      // Clear & Draw Sky
      ctx.fillStyle = '#070714'; ctx.fillRect(0, 0, 800, 600);

      // Synthwave Retro Sun
      const sunGrad = ctx.createRadialGradient(400, 230, 20, 400, 230, 85);
      sunGrad.addColorStop(0, '#ffff00'); sunGrad.addColorStop(0.6, '#ff007f'); sunGrad.addColorStop(1, 'rgba(255,0,127,0)');
      ctx.fillStyle = sunGrad; ctx.beginPath(); ctx.arc(400, 230, 85, 0, Math.PI * 2); ctx.fill();

      // Sun Grid horizontal lines
      ctx.fillStyle = '#070714';
      for (let s = 190; s < 250; s += 8) {
        ctx.fillRect(310, s, 180, (s - 180) * 0.08);
      }

      // Pseudo 3D Road
      const horizon = 250;
      for (let y = horizon; y < 600; y += 4) {
        const p = (y - horizon) / (600 - horizon);
        const w = p * 760;
        const x = 400 + playerX * (1 - p) * 220;
        const isStripe = Math.floor((600 - y + roadOffset * 120) / 24) % 2 === 0;

        ctx.fillStyle = isStripe ? '#141729' : '#1b2038';
        ctx.fillRect(x - w / 2, y, w, 4);

        // Neon Glow Edges
        ctx.fillStyle = isStripe ? '#00f5ff' : '#ff007f';
        ctx.fillRect(x - w / 2 - 10 * p, y, 10 * p, 4);
        ctx.fillRect(x + w / 2, y, 10 * p, 4);
      }

      // Draw & Update Traffic
      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.z -= (speed - car.speed) * 0.00035;
        if (car.z <= 0.02 || car.z > 1.2) { traffic.splice(i, 1); continue; }

        const p = (1 - car.z);
        const cy = horizon + p * (600 - horizon);
        const cx = 400 + (car.x - playerX * p) * 360;
        const cw = 54 * p, ch = 32 * p;

        // Draw Traffic Car
        ctx.fillStyle = car.color;
        ctx.shadowColor = car.color; ctx.shadowBlur = 10;
        ctx.fillRect(cx - cw/2, cy - ch, cw, ch);
        ctx.shadowBlur = 0;
        // Taillights
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(cx - cw*0.4, cy - ch*0.35, cw*0.22, ch*0.3);
        ctx.fillRect(cx + cw*0.18, cy - ch*0.35, cw*0.22, ch*0.3);

        // Collision Check
        if (car.z < 0.28 && car.z > 0.08 && Math.abs(cx - 400) < 38) {
          isGameOver = true;
          playBeep(120, 0.4);
          document.getElementById('final-score').textContent = score;
          document.getElementById('gameover-modal').style.display = 'flex';
          return;
        }
      }

      // Draw Player Sports Car
      const px = 400, py = 520;
      ctx.fillStyle = '#00f5ff';
      ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.roundRect(px - 36, py - 20, 72, 38, 8); ctx.fill();
      ctx.shadowBlur = 0;

      // Windshield & roof
      ctx.fillStyle = '#0a0e27'; ctx.fillRect(px - 26, py - 14, 52, 14);
      // Red Taillights
      ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10;
      ctx.fillRect(px - 30, py + 12, 16, 6); ctx.fillRect(px + 14, py + 12, 16, 6);
      ctx.shadowBlur = 0;

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }

      // HUD updates
      document.getElementById('speed-val').textContent = Math.floor(speed);
      document.getElementById('score-val').textContent = score;
      document.getElementById('nitro-val').textContent = Math.floor(nitro) + '%';

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
