<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Drift Racer 🏎️💨</title>
  <script src="arcade-sound-engine.js"></script>
  <script src="arcade-difficulty.js"></script>
  <script src="arcade-leaderboard.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
    body { background:#070714; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; display:flex; justify-content:center; align-items:center; height:100vh; }
    #canvas-container { position:relative; width:100vw; height:100vh; max-width:800px; }
    @media (max-width: 600px) { .hud { z-index:20;  font-size:14px;  } .arcade-nav { font-size:11px; padding:6px 10px; } .steer-hint { display:none; } .ctrl-btn { width:72px; height:72px; } }
    canvas:not(#dopamine-confetti-canvas) { width:100%; height:100%; display:block; background:#070714; }
    .arcade-nav { position:absolute; top:16px; right:16px; z-index:100; background:rgba(0,0,0,0.7); border:2px solid #ff007f; color:#ff007f; padding:8px 16px; border-radius:8px; font-weight:bold; text-decoration:none; font-size:13px; box-shadow:0 0 15px rgba(255,0,127,0.4); }
    .hud { z-index:20;  position:absolute; top:16px; left:16px; font-family:monospace; font-size:18px; font-weight:bold; color:#00f5ff; text-shadow:0 0 10px #00f5ff; pointer-events:none;  }
    
    .mobile-controls { position:absolute; bottom:20px; left:0; right:0; display:flex; justify-content:space-between; padding:0 24px; pointer-events:none; }
    .ctrl-btn { width:65px; height:65px; border-radius:50%; background:rgba(0,245,255,0.2); border:2px solid #00f5ff; color:#fff; font-size:24px; font-weight:bold; display:flex; align-items:center; justify-content:center; pointer-events:auto; box-shadow:0 0 15px rgba(0,245,255,0.3); }
    .ctrl-btn:active { background:#00f5ff; color:#000; }
    .nitro-btn { background:rgba(255,0,127,0.3); border-color:#ff007f; box-shadow:0 0 15px rgba(255,0,127,0.4); font-size:20px; }
    .nitro-btn:active { background:#ff007f; color:#fff; }

    .steer-hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:14px; color:#aaa; pointer-events:none; }
    #gameover-modal { position:absolute; inset:0; background:rgba(0,0,0,0.85); display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:200; }
    #gameover-modal h1 { color:#ff007f; font-size:42px; text-shadow:0 0 20px #ff007f; }
    .btn { background:linear-gradient(135deg,#00f5ff,#ff007f); border:none; color:#fff; padding:12px 32px; font-size:18px; font-weight:bold; border-radius:8px; cursor:pointer; text-decoration:none; box-shadow:0 0 20px rgba(0,245,255,0.5); }
  
/* Universal Mobile Touch & Top Navigation Safeguards */
.arcade-nav, .arcade-link, .nav-btn-arcade, .arcade-corner-btn, .arcade-btn, .btn-arcade, a[href*="arcad"], #modal a, #modal button, .modal a, .modal button, #game-over-modal a, #game-over-modal button {
  pointer-events: auto !important;
  touch-action: auto !important;
  cursor: pointer !important;
  -webkit-tap-highlight-color: rgba(0, 245, 255, 0.4);
}

</style>
</head>
<body>
  <div id="canvas-container">
    <a href="https://marcuscaiado.github.io/marcus-arcade/" class="arcade-nav" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">🕹️ Arcade Hub</a>
    <div class="hud">
      <div>SPEED: <span id="speed-val">120</span> KM/H</div>
      <div>SCORE: <span id="score-val">0</span></div>
      <div>NITRO: <span id="nitro-val">100%</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="mobile-controls">
      <div style="display:flex; gap:14px;">
        <div class="ctrl-btn" id="btn-left">◀</div>
        <div class="ctrl-btn" id="btn-right">▶</div>
      </div>
      <div class="ctrl-btn nitro-btn" id="btn-nitro">⚡</div>
    </div>
    
    <div class="steer-hint">A / D / Mouse to Switch Lanes • Space / Click for Nitro ⚡</div>
    
    <div id="gameover-modal">
      <h1>CRASHED! 💥</h1>
      <p style="font-size:20px;">SCORE: <span id="final-score">0</span></p>
      <button class="btn" onclick="restartGame()">RACE AGAIN 🔄</button>
      <a href="https://marcuscaiado.github.io/marcus-arcade/" class="btn" style="background:#222; border:1px solid #ff007f;" target="_top" onclick="if(window.top){window.top.location.href=this.href;return false;}" ontouchend="if(window.top){window.top.location.href=this.href;return false;}">ARCADE HUB 🕹️</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Synth
    let audioCtx = null;
    function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
    function playBeep(freq, dur) {
      if (window.arcadeAudio) {
        if (freq >= 1000) {
          window.arcadeAudio.playCollectStreak(3);
          return;
        } else if (freq >= 700) {
          window.arcadeAudio.playPop(1.5, dur || 0.08);
          return;
        } else if (freq <= 250) {
          window.arcadeAudio.playSoftThud(1.2);
          return;
        } else {
          window.arcadeAudio.playPop(freq / 450, dur || 0.05);
          return;
        }
      }
      try {
        const c = getAudio(); const osc = c.createOscillator(); const g = c.createGain();
        osc.frequency.setValueAtTime(freq, c.currentTime);
        g.gain.setValueAtTime(0.1, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + dur);
        osc.connect(g); g.connect(c.destination); osc.start(); osc.stop(c.currentTime + dur);
      } catch(e){}
    }

    // State
    const LANES = [-0.75, -0.25, 0.25, 0.75]; // 4 distinct lanes
    let currentLaneIdx = 1; // Start in lane 2
    let playerX = LANES[currentLaneIdx], targetPlayerX = LANES[currentLaneIdx];
    let speed = 120, baseSpeed = 120, maxSpeed = 220, nitro = 100, score = 0, roadOffset = 0, isGameOver = false;
    let isBoosting = false;
    let traffic = [], particles = [];

    function switchLaneLeft() {
      if (currentLaneIdx > 0) {
        currentLaneIdx--;
        targetPlayerX = LANES[currentLaneIdx];
        playBeep(450, 0.05);
      }
    }

    function switchLaneRight() {
      if (currentLaneIdx < LANES.length - 1) {
        currentLaneIdx++;
        targetPlayerX = LANES[currentLaneIdx];
        playBeep(450, 0.05);
      }
    }

    // Mouse & Touch Direct Position Tracking
    const setSteerFromPointer = (cx) => {
      const rect = canvas.getBoundingClientRect();
      const norm = ((cx - rect.left) / rect.width) * 2 - 1; // -1 to 1
      targetPlayerX = Math.max(-0.85, Math.min(0.85, norm * 1.1));
      // Snap nearest lane index for AI
      let closestIdx = 0, minD = 999;
      for (let i = 0; i < LANES.length; i++) {
        const d = Math.abs(LANES[i] - targetPlayerX);
        if (d < minD) { minD = d; closestIdx = i; }
      }
      currentLaneIdx = closestIdx;
    };

    window.addEventListener('mousemove', e => setSteerFromPointer(e.clientX));
    window.addEventListener('touchmove', e => { if (e.target && e.target.closest && e.target.closest('a, button, .arcade-nav, #modal, .ctrl-btn')) return; e.preventDefault(); setSteerFromPointer(e.touches[0].clientX); }, { passive:false });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') switchLaneLeft();
      if (e.key === 'ArrowRight' || e.key === 'd') switchLaneRight();
      if (e.key === ' ' || e.key === 'Shift') isBoosting = true;
    });
    window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Shift') isBoosting = false; });

    window.addEventListener('mousedown', e => { if (!e.target.closest('.arcade-nav, #gameover-modal, .ctrl-btn')) isBoosting = true; });
    window.addEventListener('mouseup', () => isBoosting = false);

    // On-screen Buttons
    const bindBtn = (id, fn) => {
      document.getElementById(id).addEventListener('touchstart', e => { e.preventDefault(); fn(); });
      document.getElementById(id).addEventListener('click', e => { e.preventDefault(); fn(); });
    };
    bindBtn('btn-left', switchLaneLeft);
    bindBtn('btn-right', switchLaneRight);

    const nitroBtn = document.getElementById('btn-nitro');
    nitroBtn.addEventListener('touchstart', e => { e.preventDefault(); isBoosting = true; });
    nitroBtn.addEventListener('touchend', e => { e.preventDefault(); isBoosting = false; });

    let spawnTimer = 0;
    let pickups = [];

    function spawnTraffic() {
      spawnTimer++;
      const trafficCadence = window.ArcadeDifficulty ? ArcadeDifficulty.scaleInterval(85, score, 5500, 48, 1.8) : 85;
      if (spawnTimer > trafficCadence) { // Fair, controlled spawn cadence
        spawnTimer = 0;
        const ddaMult = window.ArcadeDifficulty ? ArcadeDifficulty.getMultiplier(score, 5500, 2.0) : 1.0;
        // Never block all lanes — randomly pick 1 or 2 lanes max
        const numCars = Math.random() < Math.min(0.55, 0.35 * ddaMult) ? 2 : 1;
        const availableLanes = [...LANES].sort(() => Math.random() - 0.5);

        for (let i = 0; i < numCars; i++) {
          traffic.push({
            laneX: availableLanes[i],
            z: 1.0,
            color: ['#ff007f', '#00f5ff', '#ffff00', '#00ff88', '#b967ff'][Math.floor(Math.random() * 5)],
            nearMissGiven: false
          });
        }

        // Spawn occasional Nitro battery pickup in open lane
        if (Math.random() < 0.30) {
          const freeLanes = availableLanes.slice(numCars);
          if (freeLanes.length > 0) {
            pickups.push({ laneX: freeLanes[0], z: 1.0, collected: false });
          }
        }
      }
    }

    function restartGame() {
      if (window.ArcadeDifficulty) ArcadeDifficulty.reset();
      currentLaneIdx = 1;
      playerX = LANES[currentLaneIdx]; targetPlayerX = LANES[currentLaneIdx];
      speed = 120; nitro = 100; score = 0; roadOffset = 0; traffic = []; pickups = []; particles = []; isGameOver = false; spawnTimer = 0;
      document.getElementById('gameover-modal').style.display = 'none';
      requestAnimationFrame(loop);
    }

    function loop() {
      if (isGameOver) return;

      // Smooth Steering Lerp with tight grip
      const turnDelta = targetPlayerX - playerX;
      playerX += turnDelta * 0.22;

      // Nitro & Speed
      if (isBoosting && nitro > 0) {
        speed = Math.min(speed + 2.5, maxSpeed);
        nitro -= 0.35;
        // Nitro flame particles
        for (let i=0; i<3; i++) {
          particles.push({
            x: 400 + playerX * 240 + (Math.random()-0.5)*16,
            y: 535,
            vx: (Math.random()-0.5)*3,
            vy: 6 + Math.random()*4,
            color: '#00f5ff', life: 1
          });
        }
      } else {
        speed = Math.max(speed - 1.5, baseSpeed);
        if (nitro < 100) nitro += 0.20;
      }

      score += Math.floor(speed * 0.05);
      roadOffset += speed * 0.003;
      spawnTraffic();

      // Clear Canvas
      ctx.fillStyle = '#070714'; ctx.fillRect(0, 0, 800, 600);

      // Synthwave Retro Sun
      const sunGrad = ctx.createRadialGradient(400, 220, 20, 400, 220, 85);
      sunGrad.addColorStop(0, '#ffff00'); sunGrad.addColorStop(0.6, '#ff007f'); sunGrad.addColorStop(1, 'rgba(255,0,127,0)');
      ctx.fillStyle = sunGrad; ctx.beginPath(); ctx.arc(400, 220, 85, 0, Math.PI * 2); ctx.fill();

      // Horizon & 3D Road
      const horizon = 240;
      for (let y = horizon; y < 600; y += 4) {
        const p = (y - horizon) / (600 - horizon);
        const w = p * 760;
        const isStripe = Math.floor((600 - y + roadOffset * 120) / 24) % 2 === 0;

        // Road Surface
        ctx.fillStyle = isStripe ? '#131628' : '#1a1f38';
        ctx.fillRect(400 - w / 2, y, w, 4);

        // Neon Glow Edges
        ctx.fillStyle = isStripe ? '#00f5ff' : '#ff007f';
        ctx.fillRect(400 - w / 2 - 8 * p, y, 8 * p, 4);
        ctx.fillRect(400 + w / 2, y, 8 * p, 4);
      }

      // Lane Dividers
      for (let y = horizon; y < 600; y += 8) {
        const p = (y - horizon) / (600 - horizon);
        const isStripe = Math.floor((600 - y + roadOffset * 120) / 24) % 2 === 0;
        if (isStripe) {
          ctx.fillStyle = 'rgba(255,255,255,0.2)';
          ctx.fillRect(400 - 180 * p, y, 3 * p, 6);
          ctx.fillRect(400, y, 3 * p, 6);
          ctx.fillRect(400 + 180 * p, y, 3 * p, 6);
        }
      }

      // Draw & Update Nitro Pickups
      const ddaSpeedScale = window.ArcadeDifficulty ? Math.min(1.35, 0.92 + 0.08 * ArcadeDifficulty.getMultiplier(score, 5500, 2.0)) : 1.0;
      const approachSpeed = 0.007 * (speed / 120) * ddaSpeedScale;
      const playerScreenX = 400 + playerX * 240;

      for (let i = pickups.length - 1; i >= 0; i--) {
        const pu = pickups[i];
        pu.z -= approachSpeed;
        if (pu.z <= -0.1) { pickups.splice(i, 1); continue; }

        const p = (1 - pu.z);
        const cy = horizon + p * (600 - horizon);
        const cx = 400 + pu.laneX * p * 340;

        if (!pu.collected) {
          ctx.fillStyle = '#00f5ff';
          ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 15 * p;
          ctx.beginPath(); ctx.arc(cx, cy - 15 * p, 14 * p, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${Math.max(10, 16 * p)}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText('⚡', cx, cy - 15 * p);
          ctx.shadowBlur = 0;

          if (pu.z < 0.22 && pu.z > 0.02 && Math.abs(cx - playerScreenX) < 48) {
            pu.collected = true;
            nitro = Math.min(100, nitro + 35);
            score += 250;
            if (window.DopamineSynth) {
              window.DopamineSynth.playScore(0.22);
            } else {
              playBeep(1100, 0.12);
            }
            if (window.DopamineJuice) {
              window.DopamineJuice.spawnScore(cx, cy, '+250 NITRO ⚡', 2);
            }
            for (let k=0; k<8; k++) particles.push({ x: cx, y: cy, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, color:'#00f5ff', life:1 });
          }
        }
      }

      // Draw & Update Traffic
      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.z -= approachSpeed;

        if (car.z <= -0.1) { traffic.splice(i, 1); continue; }

        const p = (1 - car.z);
        const cy = horizon + p * (600 - horizon);
        const cx = 400 + car.laneX * p * 340;
        const cw = 60 * p, ch = 36 * p;

        // Draw Traffic Car
        ctx.fillStyle = car.color;
        ctx.shadowColor = car.color; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.roundRect(cx - cw/2, cy - ch, cw, ch, 4 * p); ctx.fill();
        ctx.shadowBlur = 0;

        // Taillights
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(cx - cw*0.38, cy - ch*0.35, cw*0.22, ch*0.3);
        ctx.fillRect(cx + cw*0.16, cy - ch*0.35, cw*0.22, ch*0.3);

        // Near Miss Bonus
        if (car.z < 0.25 && car.z > 0.05 && !car.nearMissGiven && Math.abs(cx - playerScreenX) > 38 && Math.abs(cx - playerScreenX) < 110) {
          car.nearMissGiven = true;
          score += 150;
          if (window.DopamineSynth) {
            window.DopamineSynth.playCombo(2);
          } else {
            playBeep(900, 0.08);
          }
          if (window.DopamineJuice) {
            window.DopamineJuice.spawnScore(cx, cy, 'NEAR MISS! +150 🏎️', 2);
          }
        }

        // Forgiving Collision Check
        if (car.z < 0.20 && car.z > 0.03) {
          if (Math.abs(cx - playerScreenX) < 38) {
            isGameOver = true;
            if (window.DopamineSynth) window.DopamineSynth.playWin();
            if (window.DopamineJuice) window.DopamineJuice.explodeConfetti(window.innerWidth / 2, window.innerHeight * 0.4, 65);
            document.getElementById('final-score').textContent = score;
            document.getElementById('gameover-modal').style.display = 'flex';
            try {
              if (window.ArcadeLeaderboard) {
                window.ArcadeLeaderboard.submitScore('neon-drift-racer', score);
              }
            } catch(e){}
            return;
          }
        }
      }

      // Draw Player Sports Car with Visible Lane Position & Turn Tilting
      const px = 400 + playerX * 240;
      const py = 500;
      const tilt = Math.max(-0.25, Math.min(0.25, turnDelta * 0.4));

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(tilt);

      // Car Body
      ctx.fillStyle = '#00f5ff';
      ctx.shadowColor = '#00f5ff'; ctx.shadowBlur = 22;
      ctx.beginPath(); ctx.roundRect(-38, -20, 76, 42, 8); ctx.fill();
      ctx.shadowBlur = 0;

      // Roof & Windshield
      ctx.fillStyle = '#0a0e27'; ctx.fillRect(-28, -14, 56, 16);
      
      // Neon Side Stripes
      ctx.fillStyle = '#ff007f';
      ctx.fillRect(-38, -20, 8, 42);
      ctx.fillRect(30, -20, 8, 42);

      // Red Taillights
      ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 12;
      ctx.fillRect(-32, 14, 18, 6); ctx.fillRect(14, 14, 18, 6);
      ctx.shadowBlur = 0;

      ctx.restore();

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
      }

      // HUD updates
      document.getElementById('speed-val').textContent = Math.floor(speed);
      document.getElementById('score-val').textContent = score;
      document.getElementById('nitro-val').textContent = Math.floor(nitro) + '%';

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
